name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    # macOS only, like the package itself. Tests that need a real Rex (the Lua ones) skip when rex isn't on PATH.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      # --ignore-scripts: `prepare` runs the build, which has its own step below.
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      # Build before testing: the CLI tests run dist/cli/rex-grokbot.js.
      - run: npm run build
      - run: npm test
