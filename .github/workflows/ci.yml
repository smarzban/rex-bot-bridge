name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    # macOS only, like the package itself. Tests that need a real Rex (the Lua ones) skip when rex isn't on PATH.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      # --ignore-scripts: `prepare` runs the build, which has its own step below.
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      # Build before testing: the CLI tests run dist/cli/rex-grokbot.js.
      - run: npm run build
      - run: npm test
